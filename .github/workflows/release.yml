name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager -print | sort -V | tail -n 1)
          fi
          test -x "$SDKMANAGER"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build production web
        run: npm run build
      - name: Capacitor Android sync
        run: npx cap sync android
      - name: Verify release tag matches Android version
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -n 1)
          if [[ -z "$VERSION_NAME" || "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' must match Android versionName 'v$VERSION_NAME'."
            exit 1
          fi
      - name: Prepare Android keystore from secret
        id: keystore
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$DERUWESTEEN_RELEASE_STORE_FILE"
          test -s "$DERUWESTEEN_RELEASE_STORE_FILE"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DERUWESTEEN_RELEASE_STORE_FILE: ${{ runner.temp }}/deruwesteen-release.jks
      - name: Build Android release APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          DERUWESTEEN_RELEASE_STORE_FILE: ${{ runner.temp }}/deruwesteen-release.jks
          DERUWESTEEN_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DERUWESTEEN_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DERUWESTEEN_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify signed APK
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)
          "$APKSIGNER" verify "android/app/build/outputs/apk/release/app-release.apk"
      - name: Upload release APK to GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/deruwesteen-release.jks"
